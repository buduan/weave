openapi: 3.1.0
info:
  title: Orz People Platform API
  description: HTTP API for the Orz People Platform.
  version: 0.1.0
servers:
  - url: http://localhost:6770
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Users
  - name: Form filling
  - name: Datasets
paths:
  /health:
    get:
      tags: [System]
      summary: Check service health
      operationId: getHealth
      responses:
        '200':
          description: The service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /auth/login/options:
    post:
      tags: [Authentication]
      summary: Discover whether an identifier enters login or registration
      operationId: discoverLoginOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
      responses:
        '200':
          description: The next public authentication step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOptionsEnvelope'
        '400':
          description: The username or phone does not belong to an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotFoundEnvelope'
  /auth/register/start:
    post:
      tags: [Authentication]
      summary: Start a short-lived email registration flow
      operationId: startRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '201':
          description: Registration flow created and initial code requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStartedEnvelope'
  /auth/register/code/request:
    post:
      tags: [Authentication]
      summary: Request or resend the registration email code
      operationId: requestRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationFlowRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
  /auth/register/code/verify:
    post:
      tags: [Authentication]
      summary: Verify the registration email code
      operationId: verifyRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCodeRequest'
      responses:
        '200':
          description: The registration email was verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationVerifiedEnvelope'
  /auth/register/complete:
    post:
      tags: [Authentication]
      summary: Create the verified user and return Tokens
      operationId: completeRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCompleteRequest'
      responses:
        '200':
          description: Registration completed and a Session was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEnvelope'
  /auth/login/password:
    post:
      tags: [Authentication]
      summary: Sign in with password
      operationId: loginWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Tokens or a password-primary MFA challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEnvelope'
  /auth/login/code/request:
    post:
      tags: [Authentication]
      summary: Request a non-enumerating email login code by identifier
      operationId: requestLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
  /auth/login/code/verify:
    post:
      tags: [Authentication]
      summary: Sign in with an email code
      operationId: loginWithCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeLoginRequest'
      responses:
        '200':
          description: Code verified and a Session was created without secondary MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEnvelope'
  /auth/login/passkey/options:
    post:
      tags: [Authentication]
      summary: Create discoverable Passkey assertion options
      operationId: createPasskeyLoginOptions
      responses:
        '201':
          description: One-time challenge and WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptionsEnvelope'
  /auth/login/passkey/verify:
    post:
      tags: [Authentication]
      summary: Verify a direct Passkey login
      operationId: verifyPasskeyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyVerifyRequest'
      responses:
        '200':
          description: Passkey verified and a Session was created without secondary MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEnvelope'
  /auth/mfa/code/request:
    post:
      tags: [Authentication]
      summary: Request an email or SMS MFA code
      operationId: requestMfaCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreatedAccepted'
  /auth/mfa/complete:
    post:
      tags: [Authentication]
      summary: Complete message or TOTP MFA
      operationId: completeMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCompleteRequest'
      responses:
        '200':
          description: MFA completed and a Session was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEnvelope'
  /auth/mfa/passkey/options:
    post:
      tags: [Authentication]
      summary: Create Passkey assertion options bound to an MFA challenge
      operationId: createMfaPasskeyOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaPasskeyOptionsRequest'
      responses:
        '200':
          description: One-time bound assertion and WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaPasskeyOptionsEnvelope'
  /auth/mfa/passkey/complete:
    post:
      tags: [Authentication]
      summary: Complete Passkey MFA
      operationId: completeMfaPasskey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaPasskeyCompleteRequest'
      responses:
        '200':
          description: Passkey MFA completed and a Session was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationEnvelope'
  /auth/token/refresh:
    post:
      tags: [Authentication]
      summary: Atomically replace a refresh Token pair
      operationId: refreshTokens
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Replacement Tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensEnvelope'
  /auth/password/reset/request:
    post:
      tags: [Authentication]
      summary: Request a non-enumerating password reset code
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreatedAccepted'
  /auth/password/reset:
    post:
      tags: [Authentication]
      summary: Reset a password using an email code
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreatedAccepted'
  /user/me:
    get:
      tags: [Users]
      summary: Get the authenticated user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current safe user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
  /forms/getPublishedForm/{formId}:
    get:
      tags: [Form filling]
      summary: Get the active published Form definition by global Form ID
      operationId: getPublishedForm
      description: >-
        Authentication is optional. If a Bearer token is supplied it must be valid;
        authenticated update-subject callers may receive their actor-bound context.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Minimal active published definition and current availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedFormEnvelope'
        '401':
          description: A supplied Bearer token is invalid or no longer has a live Session.
        '404':
          description: The Form is missing, archived, or has no active published release.
  /forms/getRelationOptions/{formId}/{itemId}:
    get:
      tags: [Form filling]
      summary: Get safe dynamic options for a published relation item
      operationId: getFormRelationOptions
      security: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: values
          in: query
          description: JSON object containing current declared valueFrom dependencies.
          schema:
            type: string
            maxLength: 20000
        - name: take
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Opaque row IDs and display labels only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormRelationOptionsEnvelope'
        '400':
          description: Invalid values/take or the item is not a configured relation selector.
        '404':
          description: The published Form or item was not found.
  /forms/submitForm:
    post:
      tags: [Form filling]
      summary: Submit answers to a published Form
      operationId: submitForm
      description: >-
        Authentication is optional. The operation revalidates availability, access,
        Schema, Dataset mappings, relations and subject-row revision on the server.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFormRequest'
      responses:
        '201':
          description: Submission created or subject row updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitFormEnvelope'
        '400':
          description: Invalid DTO, Schema answers, hidden item, mapping, or idempotency key.
        '401':
          description: Authentication is required or a supplied Bearer token is invalid.
        '404':
          description: The published Form or required subject row was not found.
        '409':
          description: Closed state, stale revision, or conflicting idempotency payload.
        '429':
          description: The per-Form actor/network submission limit was exceeded.
  /workspaces/{workspaceId}/datasets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Datasets]
      operationId: listDatasets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Visible Datasets and creation capability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetListEnvelope' }
    post:
      tags: [Datasets]
      operationId: createDataset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDatasetRequest' }
      responses:
        '201':
          description: Dataset created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
    get:
      tags: [Datasets]
      operationId: getDataset
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dataset detail, active fields, creator and capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetDetailEnvelope' }
    patch:
      tags: [Datasets]
      operationId: updateDataset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDatasetRequest' }
      responses:
        '200':
          description: Dataset updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      tags: [Datasets]
      operationId: archiveDataset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '201':
          description: Dataset archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/fields:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      tags: [Datasets]
      operationId: createDatasetField
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDatasetFieldRequest' }
      responses:
        '201':
          description: Field created and positioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetFieldMutationEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/FieldId'
    patch:
      tags: [Datasets]
      operationId: updateDatasetField
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDatasetFieldRequest' }
      responses:
        '200':
          description: Field updated and positions normalized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetFieldMutationEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/fields/{fieldId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/FieldId'
    post:
      tags: [Datasets]
      operationId: archiveDatasetField
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveDatasetFieldRequest' }
      responses:
        '201':
          description: Field archived and positions normalized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetFieldMutationEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/fields/{fieldId}/options:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/FieldId'
      - name: search
        in: query
        schema: { type: string, maxLength: 128 }
      - name: cursor
        in: query
        schema: { type: string }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: selectedIds
        in: query
        schema: { type: array, maxItems: 100, items: { type: string } }
    get:
      tags: [Datasets]
      operationId: listDatasetRelationOptions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paged relation options with selected values retained.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetRelationOptionEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/rows/query:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      tags: [Datasets]
      operationId: queryDatasetRows
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatasetWindowQueryRequest' }
      responses:
        '201':
          description: Absolute Dataset row window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetWindowEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/rows:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      tags: [Datasets]
      operationId: createDatasetRow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDatasetRowRequest' }
      responses:
        '201':
          description: Materialized Dataset row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetRowEnvelope' }
  /workspaces/{workspaceId}/datasets/{datasetId}/rows/{rowId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DatasetId'
      - name: rowId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Datasets]
      operationId: updateDatasetRow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDatasetRowRequest' }
      responses:
        '200':
          description: Materialized updated Dataset row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetRowEnvelope' }
    delete:
      tags: [Datasets]
      operationId: deleteDatasetRow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Accepted:
      description: The request was accepted without revealing account state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedEnvelope'
    CreatedAccepted:
      description: The request was accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedAcceptedEnvelope'
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    FieldId:
      name: fieldId
      in: path
      required: true
      schema: { type: string }
  schemas:
    EnvelopeBase:
      type: object
      required: [status, data, timestamp]
      properties:
        status:
          type: string
          enum:
            - success
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - internal_error
            - unknown
            - account_not_found
            - invalid_credentials
            - registration_expired
            - registration_unverified
            - username_unavailable
        timestamp:
          type: string
          format: date-time
    AccountNotFoundEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [message]
          properties:
            status:
              const: account_not_found
            data:
              type: 'null'
            message:
              type: string
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [service, status]
              properties:
                service:
                  type: string
                  example: weave-backend
                status:
                  type: string
                  example: ok
    AcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            status:
              const: success
            data:
              type: object
              required: [accepted]
              properties:
                accepted:
                  const: true
    CreatedAcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            status:
              const: success
            data:
              type: object
              required: [accepted]
              properties:
                accepted:
                  const: true
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    IdentifierRequest:
      type: object
      required: [identifier]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
    RegistrationFlowRequest:
      type: object
      required: [registrationId]
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
    RegistrationCodeRequest:
      allOf:
        - $ref: '#/components/schemas/RegistrationFlowRequest'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: '^\d{6}$'
    RegistrationCompleteRequest:
      type: object
      required: [registrationId, name]
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        username:
          type: string
          pattern: '^[a-z][a-z0-9_-]{2,63}$'
        deviceName:
          type: string
          maxLength: 128
    PasswordLoginRequest:
      allOf:
        - $ref: '#/components/schemas/IdentifierRequest'
        - type: object
          required: [password]
          properties:
            password:
              type: string
              maxLength: 128
            deviceName:
              type: string
              maxLength: 128
    CodeLoginRequest:
      allOf:
        - $ref: '#/components/schemas/IdentifierRequest'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: '^\d{6}$'
            deviceName:
              type: string
              maxLength: 128
    PasswordResetRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        newPassword:
          type: string
    MfaCodeRequest:
      type: object
      required: [challengeId, factor]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        factor:
          type: string
          enum: [email, sms]
    MfaCompleteRequest:
      type: object
      required: [challengeId, factor, code]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        factor:
          type: string
          enum: [email, sms, totp]
        code:
          type: string
          pattern: '^\d{6}$'
    MfaPasskeyOptionsRequest:
      type: object
      required: [challengeId]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
    PasskeyVerifyRequest:
      type: object
      required: [challengeId, response]
      additionalProperties: false
      properties:
        challengeId:
          type: string
        response:
          type: object
          additionalProperties: true
        deviceName:
          type: string
          maxLength: 128
    MfaPasskeyCompleteRequest:
      type: object
      required: [challengeId, assertionId, response]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        assertionId:
          type: string
          format: uuid
        response:
          type: object
          additionalProperties: true
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          minimum: 1
    AuthenticatedOutcome:
      type: object
      required: [outcome, tokens]
      properties:
        outcome:
          const: authenticated
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    MfaRequiredOutcome:
      type: object
      required: [outcome, challengeId, factors, expiresIn]
      properties:
        outcome:
          const: mfa_required
        challengeId:
          type: string
          format: uuid
        factors:
          type: array
          minItems: 1
          items:
            type: string
            enum: [email, sms, totp, passkey]
        expiresIn:
          type: integer
          minimum: 1
    AuthenticationResult:
      oneOf:
        - $ref: '#/components/schemas/AuthenticatedOutcome'
        - $ref: '#/components/schemas/MfaRequiredOutcome'
      discriminator:
        propertyName: outcome
    AuthenticationEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthenticationResult'
    AuthTokensEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokens'
    LoginOptions:
      oneOf:
        - type: object
          required: [next]
          properties:
            next:
              const: login
        - type: object
          required: [next, email]
          properties:
            next:
              const: register
            email:
              type: string
              format: email
      discriminator:
        propertyName: next
    LoginOptionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginOptions'
    RegistrationStarted:
      type: object
      required: [registrationId, expiresIn]
      properties:
        registrationId:
          type: string
          format: uuid
        expiresIn:
          type: integer
          minimum: 1
    RegistrationStartedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegistrationStarted'
    RegistrationVerifiedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [verified]
              properties:
                verified:
                  const: true
    PasskeyOptionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [challengeId, options]
              properties:
                challengeId:
                  type: string
                options:
                  type: object
                  additionalProperties: true
    MfaPasskeyOptionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [assertionId, options]
              properties:
                assertionId:
                  type: string
                  format: uuid
                options:
                  type: object
                  additionalProperties: true
    LocalizedText:
      type: object
      additionalProperties:
        type: string
    FormSubmissionContext:
      type: object
      required: [answers, expectedRevision]
      additionalProperties: false
      properties:
        answers:
          type: object
          additionalProperties: true
        expectedRevision:
          type: integer
          minimum: 1
    PublishedForm:
      type: object
      required:
        - id
        - version
        - defaultLocale
        - nameI18n
        - descriptionI18n
        - closingMessageI18n
        - opensAt
        - closesAt
        - submissionAccess
        - writeMode
        - schema
        - acceptingSubmissions
        - unavailableReason
        - submissionContext
      additionalProperties: false
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        defaultLocale:
          type: string
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
        descriptionI18n:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        closingMessageI18n:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        opensAt:
          type: [string, 'null']
          format: date-time
        closesAt:
          type: [string, 'null']
          format: date-time
        submissionAccess:
          type: string
          enum: [anonymous_allowed, authentication_required]
        writeMode:
          type: string
          enum: [create_row, update_subject_row]
        schema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: boolean
        acceptingSubmissions:
          type: boolean
        unavailableReason:
          type: [string, 'null']
          enum: [not_started, closed, inactive, subject_row_missing, null]
        submissionContext:
          oneOf:
            - $ref: '#/components/schemas/FormSubmissionContext'
            - type: 'null'
    PublishedFormEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PublishedForm'
    FormRelationOption:
      type: object
      required: [id, label]
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
    FormRelationOptionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FormRelationOption'
    SubmitFormRequest:
      type: object
      required: [formId, answers]
      additionalProperties: false
      properties:
        formId:
          type: string
          minLength: 1
          maxLength: 128
        answers:
          type: object
          additionalProperties: true
        expectedRevision:
          type: integer
          minimum: 1
    SubmitFormResult:
      type: object
      required: [submissionId, operation, submittedAt]
      additionalProperties: false
      properties:
        submissionId:
          type: string
        operation:
          type: string
          enum: [created, updated]
        submittedAt:
          type: string
          format: date-time
    SubmitFormEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SubmitFormResult'
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [id, email, username, nickname, status]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                username:
                  type: string
                nickname:
                  type: string
                status:
                  type: string
                  enum: [pending, active, disabled]
    DatasetSummary:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, slug, description, type, status, subjectMode, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        type: { type: string, enum: [standard, members, join_requests, activity_registrations] }
        status: { type: string, enum: [active, archived] }
        subjectMode: { type: string, enum: [none, single_per_user] }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DatasetCreator:
      type: object
      additionalProperties: false
      required: [id, displayName, avatarUrl]
      properties:
        id: { type: string }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
    DatasetCapabilities:
      type: object
      additionalProperties: false
      required: [canUpdateMetadata, canArchive, canManageFields, canCreateRows, canUpdateRows, canDeleteRows]
      properties:
        canUpdateMetadata: { type: boolean }
        canArchive: { type: boolean }
        canManageFields: { type: boolean }
        canCreateRows: { type: boolean }
        canUpdateRows: { type: boolean }
        canDeleteRows: { type: boolean }
    DatasetField:
      type: object
      additionalProperties: false
      required: [id, datasetId, key, name, description, dataType, kind, valueSchema, config, required, isSystemManaged, systemKey, relationTargetDatasetId, relationCardinality, position, revision, archivedAt]
      properties:
        id: { type: string }
        datasetId: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        dataType: { type: string, enum: [string, number, boolean, 'string[]', json, relation] }
        kind: { type: string, enum: [text, long_text, number, percent, currency, checkbox, date, time, datetime, email, url, single_select, multi_select, cascader, tags, json, relation] }
        valueSchema: {}
        config: { type: object, additionalProperties: true }
        required: { type: boolean }
        isSystemManaged: { type: boolean }
        systemKey: { type: [string, 'null'] }
        relationTargetDatasetId: { type: [string, 'null'] }
        relationCardinality: { type: [string, 'null'], enum: [one, many, null] }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        archivedAt: { type: [string, 'null'], format: date-time }
    DatasetRow:
      type: object
      additionalProperties: false
      required: [id, datasetId, values, relations, revision, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string }
        datasetId: { type: string }
        values: { type: object, additionalProperties: true }
        relations:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    DatasetDetail:
      type: object
      required: [dataset, fields, creator, capabilities]
      properties:
        dataset: { $ref: '#/components/schemas/DatasetSummary' }
        fields: { type: array, items: { $ref: '#/components/schemas/DatasetField' } }
        creator: { $ref: '#/components/schemas/DatasetCreator' }
        capabilities: { $ref: '#/components/schemas/DatasetCapabilities' }
    DatasetList:
      type: object
      required: [items, canCreate]
      properties:
        canCreate: { type: boolean }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/DatasetSummary' }
              - type: object
                required: [creator, capabilities]
                properties:
                  creator: { $ref: '#/components/schemas/DatasetCreator' }
                  capabilities: { $ref: '#/components/schemas/DatasetCapabilities' }
    CreateDatasetRequest:
      type: object
      additionalProperties: false
      required: [name, slug, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64 }
        description: { type: string, maxLength: 2000 }
        type: { type: string, enum: [standard, join_requests] }
        subjectMode: { type: string, enum: [none, single_per_user], default: none }
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    UpdateDatasetRequest:
      allOf:
        - { $ref: '#/components/schemas/RevisionRequest' }
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 128 }
            slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64 }
            description: { type: [string, 'null'], maxLength: 2000 }
    CreateDatasetFieldRequest:
      type: object
      additionalProperties: false
      required: [expectedDatasetRevision, key, name, kind]
      properties:
        expectedDatasetRevision: { type: integer, minimum: 1 }
        key: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/DatasetField/properties/kind' }
        valueSchema: {}
        config: { type: object, additionalProperties: true }
        required: { type: boolean }
        relationTargetDatasetId: { type: string }
        relationCardinality: { type: string, enum: [one, many] }
        position: { type: integer, minimum: 0 }
    UpdateDatasetFieldRequest:
      type: object
      additionalProperties: false
      required: [expectedDatasetRevision, expectedFieldRevision]
      properties:
        expectedDatasetRevision: { type: integer, minimum: 1 }
        expectedFieldRevision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/DatasetField/properties/kind' }
        valueSchema: {}
        config: { type: object, additionalProperties: true }
        required: { type: boolean }
        position: { type: integer, minimum: 0 }
    ArchiveDatasetFieldRequest:
      type: object
      additionalProperties: false
      required: [expectedDatasetRevision, expectedFieldRevision]
      properties:
        expectedDatasetRevision: { type: integer, minimum: 1 }
        expectedFieldRevision: { type: integer, minimum: 1 }
    DatasetTableQuery:
      type: object
      additionalProperties: false
      required: [filters, sorts, group]
      properties:
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, fieldId, operator]
            properties:
              id: { type: string }
              fieldId: { type: string }
              operator: { type: string, enum: [contains, equals, not_equals, gt, gte, lt, lte, is_empty, is_not_empty, contains_any, contains_all, not_contains] }
              value: {}
        sorts:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [id, fieldId, direction]
            properties:
              id: { type: string }
              fieldId: { type: string }
              direction: { type: string, enum: [asc, desc] }
        group:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [fieldId, aggregates]
              properties:
                fieldId: { type: string }
                aggregates:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, fieldId, operation]
                    properties:
                      id: { type: string }
                      fieldId: { type: string }
                      operation: { type: string, enum: [sum, avg, min, max, count_non_empty] }
    DatasetWindowQueryRequest:
      type: object
      additionalProperties: false
      required: [query, window]
      properties:
        query: { $ref: '#/components/schemas/DatasetTableQuery' }
        window:
          type: object
          additionalProperties: false
          required: [offset, limit]
          properties:
            offset: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1, maximum: 100 }
        includeGroupDirectory: { type: boolean }
    CreateDatasetRowRequest:
      type: object
      additionalProperties: false
      properties:
        values: { type: object, additionalProperties: true }
        relations: { type: object, additionalProperties: true }
    UpdateDatasetRowRequest:
      allOf:
        - { $ref: '#/components/schemas/RevisionRequest' }
        - { $ref: '#/components/schemas/CreateDatasetRowRequest' }
    DatasetEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/DatasetSummary' } }
    DatasetListEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/DatasetList' } }
    DatasetDetailEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/DatasetDetail' } }
    DatasetFieldMutationEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties:
            data:
              type: object
              required: [field, datasetRevision]
              properties:
                field: { $ref: '#/components/schemas/DatasetField' }
                datasetRevision: { type: integer, minimum: 1 }
    DatasetRowEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/DatasetRow' } }
    DatasetWindowEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties:
            data:
              type: object
              required: [queryFingerprint, totalRowCount, startIndex, items]
              properties:
                queryFingerprint: { type: string }
                totalRowCount: { type: integer, minimum: 0 }
                startIndex: { type: integer, minimum: 0 }
                items: { type: array, items: { $ref: '#/components/schemas/DatasetRow' } }
                groups: { type: array, items: { type: object, additionalProperties: true } }
    DatasetRelationOptionEnvelope:
      allOf:
        - { $ref: '#/components/schemas/EnvelopeBase' }
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [label, value]
                    properties:
                      label: { type: string }
                      value: { type: string }
                nextCursor: { type: [string, 'null'] }
